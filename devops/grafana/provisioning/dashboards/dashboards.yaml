apiVersion: 1

providers:
  - name: 'Exchange Dashboards'
    orgId: 1
#    folder: 'Matching Service'
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true